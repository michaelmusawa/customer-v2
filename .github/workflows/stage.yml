name: "stage-customer-service-app"

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: self-hosted # your internal self-hosted runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build

      - name: Deploy application via PM2
        run: |

          cd ~/customer-v2
          git fetch origin stage && git reset --hard origin/stage
          pnpm install --frozen-lockfile
          echo "Building production..."
          pnpm build
          echo "Restarting PM2 process..."
          pm2 restart customer-service
          pm2 save
          echo "✅ Staging completed successfully!"
